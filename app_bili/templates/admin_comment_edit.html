{% extends 'base.html' %}
{% load static %}
{% block title %}编辑评论 - 管理后台{% endblock %}

{% block extra_css %}
<style>
    .form-card {
        border: none;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
        border-radius: 12px;
    }
    .btn-primary {
        background-color: #1976d2;
        border-color: #1976d2;
    }
    .btn-primary:hover {
        background-color: #1565c0;
        border-color: #1565c0;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h4 class="mb-0">编辑评论</h4>
            <p class="text-muted small">修改评论内容和情感标签</p>
        </div>
        <div class="col-auto">
            <a href="{% url 'admin_comment_list' %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>返回列表
            </a>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">评论ID</label>
                            <input type="text" class="form-control" value="{{ comment.id }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">所属视频</label>
                            <input type="text" class="form-control" value="{{ comment.bvid }}" disabled>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="user_name" class="form-label">评论者昵称</label>
                        <input type="text" class="form-control" id="user_name" name="user_name" 
                               value="{{ comment.user_name }}">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">评论内容 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" name="content" rows="4" required>{{ comment.content }}</textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="coarse_sentiment" class="form-label">粗粒度情感</label>
                            <select class="form-select" id="coarse_sentiment" name="coarse_sentiment">
                                <option value="">未标注</option>
                                {% for key, label in coarse_choices %}
                                <option value="{{ key }}" {% if comment.coarse_sentiment == key %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="fine_sentiment" class="form-label">细粒度情感</label>
                            <select class="form-select" id="fine_sentiment" name="fine_sentiment">
                                <option value="">未标注</option>
                                {% for key, label in fine_choices %}
                                <option value="{{ key }}" {% if comment.fine_sentiment == key %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2">
                            <i class="fas fa-save me-2"></i>保存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
