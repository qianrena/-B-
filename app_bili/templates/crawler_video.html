{% extends 'base.html' %}
{% load static %}
{% block title %}视频爬取 - B站视频舆情可视化分析系统{% endblock %}

{% block extra_css %}
<style>
    .crawl-card {
        border: none;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
        border-radius: 12px;
    }
    .btn-primary {
        background-color: #1976d2;
        border-color: #1976d2;
    }
    .btn-primary:hover {
        background-color: #1565c0;
        border-color: #1565c0;
    }
    .small-tip {
        font-size: 0.75rem;
        color: #6c757d;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col">
            <h4 class="mb-0">视频爬取</h4>
            <p class="text-muted small">输入B站视频BV号，自动爬取视频信息与评论数据，进行舆情分析</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card crawl-card p-4">
                <form method="post" action="{% url 'crawler_video' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="bvid" class="form-label">视频BV号</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fab fa-bilibili"></i></span>
                            <input type="text" class="form-control" id="bvid" name="bvid" 
                                   placeholder="请输入视频BV号，例如：BV1xxxxx" required>
                        </div>
                        <div class="small-tip mt-2">
                            <i class="fas fa-info-circle me-1"></i>
                            BV号是B站视频的唯一标识，你可以在视频的分享链接里找到它
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2">
                            <i class="fas fa-download me-2"></i>开始爬取
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
